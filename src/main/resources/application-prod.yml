spring:
  datasource:
    url: jdbc:h2:file:${DB_PATH:./data/intranet}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false        # la consola web nunca se activa en producción

app:
  admin-password: ${ADMIN_PASSWORD:}   # contraseña del primer administrador (Fase 5)

server:
  forward-headers-strategy: framework  # respeta las cabeceras X-Forwarded-* del proxy
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}  # cookie solo por HTTPS
        http-only: true                # la cookie no es accesible desde JavaScript

logging:
  level:
    root: INFO
    "[com.intranetstemdo.intranet]": INFO