<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso')}"></head>
<body class="pagina-login">

  <main class="login-caja">
    <img th:src="@{/images/logo-stemdo.png}" alt="STEMDO" class="logo-login">
    <h1>Acceso a la intranet</h1>

    <p class="mensaje error" th:if="${param.error}">
      Usuario o contraseña incorrectos.
    </p>
    <p class="mensaje info" th:if="${param.logout}">
      Has cerrado sesión correctamente.
    </p>

    <form th:action="@{/login}" method="post">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">

      <button type="submit" class="boton">Entrar</button>
    </form>
  </main>

</body>
</html>
