<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

  <div th:fragment="chat" id="chat-widget">
    <section id="chat-panel" hidden aria-label="Asistente virtual">
      <header class="chat-cabecera">
        <strong>Asistente virtual</strong>
        <button type="button" id="chat-cerrar" aria-label="Cerrar chat">✕</button>
      </header>

      <div id="chat-mensajes" role="log" aria-live="polite"></div>

      <p class="chat-aviso">
        No incluyas datos personales ni contraseñas. Las consultas se registran para mejorar el servicio.
      </p>

      <div id="chat-entrada">
        <input type="text" id="chat-texto" maxlength="500"
               placeholder="Escribe tu duda..." autocomplete="off">
        <button type="button" id="chat-enviar">Enviar</button>
      </div>
    </section>

    <button type="button" id="chat-toggle">💬 Ayuda</button>

    <script th:src="@{/js/chat.js}"></script>
  </div>

</body>
</html>
