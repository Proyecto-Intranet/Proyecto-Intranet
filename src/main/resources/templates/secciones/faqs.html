<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Preguntas frecuentes')}"></head>
<body>
  <header th:replace="~{fragments/layout :: cabecera('')}"></header>

  <main class="contenido" style="max-width:760px;">
    <div class="cabecera-pagina">
      <span class="etiqueta-color" style="color:var(--azul);">PREGUNTAS FRECUENTES</span>
      <h1>¿En qué podemos ayudarte?</h1>
      <p th:text="${total} + ' preguntas disponibles para el asistente virtual.'">47 preguntas</p>
    </div>

    <form th:action="@{/faqs}" method="get" class="faq-buscador">
      <input type="search" name="q" th:value="${q}" placeholder="Buscar una pregunta…" autocomplete="off">
      <button type="submit">Buscar</button>
    </form>
    <p class="faq-contador" th:text="${totalFiltradas} + ' resultado' + (${totalFiltradas} == 1 ? '' : 's') + (${q != null and !q.isEmpty()} ? ' para \u201c' + ${q} + '\u201d' : '')">
      47 resultados
    </p>

    <div th:each="grupo : ${porTema}" class="faq-grupo">
      <h2 th:text="${grupo.key}">Tema</h2>
      <div class="faq-lista">
        <details class="faq-item" th:each="faq : ${grupo.value}">
          <summary th:text="${faq.pregunta}">Pregunta</summary>
          <p class="respuesta" th:text="${faq.respuesta}">Respuesta</p>
        </details>
      </div>
    </div>

    <div th:if="${totalFiltradas == 0}" class="detalle">
      <p>No hay preguntas que coincidan con tu búsqueda. Prueba con otra palabra o escribe directamente al chatbot.</p>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: pie}"></footer>
  <div th:replace="~{fragments/chat :: chat}"></div>
</body>
</html>
