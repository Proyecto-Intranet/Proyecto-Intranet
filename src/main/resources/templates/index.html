<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
  <header th:replace="~{fragments/layout :: cabecera}"></header>

  <main class="contenido">

    <div class="hero-destacada">
      <div class="barras"><span></span><span></span><span></span><span></span></div>
      <p class="etiqueta">Bienvenido/a</p>
      <h1>Hola, <span sec:authentication="name">usuario</span></h1>
    </div>

    <section class="bloque">
      <h2>Explora la intranet</h2>
      <div class="secciones-color">
        <div class="tarjeta-color c-sobre">
          <div class="cabecera-color"><div class="icono-circulo">🧭</div><h3>Sobre STEMDO</h3></div>
        </div>
        <div class="tarjeta-color c-info">
          <div class="cabecera-color"><div class="icono-circulo">ℹ️</div><h3>Info útil</h3></div>
        </div>
        <div class="tarjeta-color c-crecer">
          <div class="cabecera-color"><div class="icono-circulo">📈</div><h3>Crecer y beneficios</h3></div>
        </div>
        <div class="tarjeta-color c-comunidad">
          <div class="cabecera-color"><div class="icono-circulo">💬</div><h3>Comunidad</h3></div>
        </div>
        <div class="tarjeta-color c-bienestar">
          <div class="cabecera-color"><div class="icono-circulo">💚</div><h3>Bienestar</h3></div>
        </div>
      </div>
    </section>

  </main>

  <footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
